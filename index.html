  --tw-shadow-colored: 0 0 #0000;
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-xl{
  --tw-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 20px 25px -5px var(--tw-shadow-color), 0 8px 10px -6px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-red-900\/30{
  --tw-shadow-color: rgb(127 29 29 / 0.3);
  --tw-shadow: var(--tw-shadow-colored);
}

.shadow-red-950\/40{
  --tw-shadow-color: rgb(69 10 10 / 0.4);
  --tw-shadow: var(--tw-shadow-colored);
}

.outline{
  outline-style: solid;
}

.blur-3xl{
  --tw-blur: blur(64px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur{
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-shadow{
  transition-property: box-shadow;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-300{
  transition-duration: 300ms;
}

.\[clip-path\:polygon\(0_100\%\2c 100\%_0\2c 100\%_100\%\2c 0_100\%\)\]{
  clip-path: polygon(0 100%,100% 0,100% 100%,0 100%);
}

:root {
  --bg: #0A0A0A;
  --surface: #111111;
  --surface-2: #171717;
  --paper: #FAF7F0;
  --text: #FFFFFF;
  --muted: #B8B2A8;
  --red: #E30613;
  --red-dark: #A8040F;
  --gold: #D4AF37;
  --gold-soft: #C9A86A;
  --line: rgba(212, 175, 55, 0.32);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A0A0A;
    --surface: #111111;
    --paper: #FAF7F0;
    --text: #FFFFFF;
    --muted: #B8B2A8;
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
}

.font-serif-display {
  font-family: 'Playfair Display', Georgia, serif;
}

.gold-rule {
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  height: 1px;
}

.diagonal-card {
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), 0 100%);
}

@keyframes softPulse {
  0%,100% {
    box-shadow: 0 0 0 0 rgba(37,211,102,.45);
    transform: translateY(0);
  }

  50% {
    box-shadow: 0 0 0 12px rgba(37,211,102,0);
    transform: translateY(-2px);
  }
}

.pulse-whatsapp {
  animation: softPulse 2.4s ease-in-out infinite;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade-up {
  animation: fadeUp .8s ease both;
}

.service-img {
  transition: transform .7s ease, filter .7s ease;
}

.group:hover .service-img {
  transform: scale(1.06);
  filter: saturate(1.08);
}

.hover\:bg-\[\#E30613\]:hover{
